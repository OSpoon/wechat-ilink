services:
  backend:
    image: ${IMAGE_NAMESPACE:?set IMAGE_NAMESPACE in deploy/.env}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY:?set APP_KEY in deploy/.env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SESSION_DRIVER: memory
      MIGRATE: 'true'
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
    volumes:
      - sqlite-data:/app/tmp
    expose:
      - '3333'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3333/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    image: ${IMAGE_NAMESPACE:?set IMAGE_NAMESPACE in deploy/.env}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      NGINX_ENVSUBST_OUTPUT_DIR: /usr/share/nginx/html
    ports:
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
