name: CI and release images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, format, types, tests, and build
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NODE_ENV: production
      APP_KEY: 0123456789abcdef0123456789abcdef
      APP_URL: http://127.0.0.1:3334
      HOST: 127.0.0.1
      PORT: 3334
      LOG_LEVEL: silent
      SESSION_DRIVER: memory
      LIMITER_STORE: memory
      ILINK_APP_ID: bot
      ILINK_APP_CLIENT_VERSION: '132104'
      ILINK_CHANNEL_VERSION: 2.4.8
      ILINK_BOT_AGENT: OpenClaw
      ILINK_BASE_URL: https://ilinkai.weixin.qq.com
      ILINK_CDN_BASE_URL: https://novac2c.cdn.weixin.qq.com/c2c
      ILINK_BOT_TYPE: '3'
      MEDIA_STORAGE_PATH: tmp/media.ci
      TZ: UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check deployment installer syntax
        run: sh -n deploy/install.sh

      - name: Check pull request commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.sha }}" --verbose

      - name: Check lint
        run: pnpm lint:check

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm typecheck

      - name: Install Chromium for frontend tests
        run: pnpm --filter @wechat-ilink/frontend test:browser:install

      - name: Run backend and frontend tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Build production apps
        run: pnpm build

  publish-images:
    name: Publish release images to GitHub Container Registry
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
        shell: bash

      - name: Publish backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: backend
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}-backend:${{ github.ref_name }}
            ${{ env.IMAGE_NAMESPACE }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}-frontend:${{ github.ref_name }}
            ${{ env.IMAGE_NAMESPACE }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        run: gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
